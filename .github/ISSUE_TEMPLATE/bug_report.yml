name: Bug report
description: Report a bug in PowerMouse.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the profile, bindings, target application, and exact input sequence.
      placeholder: |
        1. Open ...
        2. Enable ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build 26100
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment details
      description: Include display scaling, keyboard layout, elevation, target application, and input/remapping tools when relevant.
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: Attach relevant lines from About > Open logs folder, with private information removed.
      render: text
